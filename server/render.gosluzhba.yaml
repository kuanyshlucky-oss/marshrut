# Render Blueprint: отдельный production-сервис для проекта «Онлайн-тренажёр тестов: госслужба РК».
# Отдельный сервис и отдельная база (Neon-проект), чтобы пользователи, заказы, платежи и оферта
# не смешивались с JetisHub. Код тот же (server/), разные только окружение и данные.
# Деплой: Render → New → Blueprint → этот репозиторий → в поле Blueprint Path указать
# server/render.gosluzhba.yaml (обычный render.yaml остаётся для основного API).
services:
  - type: web
    name: gosluzhba-api
    runtime: docker
    rootDir: server
    # Для платежей free-тариф не подходит: сервис засыпает, и вебхуки/заявки теряются. Минимум starter.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false                    # НОВАЯ база (отдельный проект Neon), не база JetisHub
      - key: ADMIN_KEY
        sync: false                    # отдельный ключ администратора
      - key: ALLOWED_ORIGIN
        sync: false                    # домен(ы) страниц тренажёра, через запятую
      - key: PUBLIC_SITE_URL
        sync: false                    # откуда ссылки в письмах, например https://trainer.example.kz
      - key: PAYMENTS_PROVIDER
        value: kaspi_qr
      - key: KASPI_QR_IMAGE_URL
        sync: false
      - key: PRODUCT_PRICE_KZT
        value: "3990"
      - key: PRODUCT_DAYS
        value: "90"
      - key: OFFER_VERSION
        value: "1.0"
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
