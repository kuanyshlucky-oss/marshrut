<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>JetisHub — Конспекты</title>
<meta name="description" content="Конспекты по темам для подготовки к вступительным экзаменам в магистратуру.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://marshrut-9c5z.onrender.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Onest:wght@400;500;600;700;800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="assets/brand/logo-mark.png" type="image/png">
<script>
// theme.js инлайн (раньше отдельный блокирующий запрос, ~460мс по PageSpeed) —
// источник в theme.js в корне репо, править синхронно в обоих местах.
(function () {
  var STORAGE_KEY = 'jetishub-theme';
  var root = document.documentElement;
  function getStored() { try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; } }
  function systemPrefersDark() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function apply(theme) { root.setAttribute('data-theme', theme); }
  apply(getStored() || (systemPrefersDark() ? 'dark' : 'light'));
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    function sync() { btn.setAttribute('aria-pressed', String(root.getAttribute('data-theme') === 'dark')); }
    sync();
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
  :root{
    --bg:#FBFBFA; --surface:#FFFFFF; --ink:#1D1D1F; --ink-soft:#6E6E73;
    --line:rgba(29,29,31,.12); --accent:#0A6CC9; --accent-on:#FFFFFF; --beige:#B08D46;
    --serif:'Space Grotesk','Onest','Manrope', system-ui, sans-serif; --mono:'Manrope', system-ui, sans-serif;
    --header-bg: rgba(251,251,250,.86);
  }
  html[data-theme="dark"]{
    --bg:#0A0A0B; --surface:#17171A; --ink:#F5F5F7; --ink-soft:rgba(245,245,247,.62);
    --line:rgba(255,255,255,.12); --accent:#4DA3FF; --accent-on:#08131F; --beige:#D9B676;
    --header-bg: rgba(10,10,11,.86);
  }
  .lang-toggle{
    display:flex; align-items:center; gap:1px; flex:0 0 auto; margin-left:8px;
    padding:3px; background:var(--bg); border:1px solid var(--line); border-radius:999px;
  }
  .lang-toggle-opt{
    padding:6px 12px; border-radius:999px; font-family:var(--mono); font-size:12px; font-weight:700;
    color:var(--ink-soft); letter-spacing:.02em; line-height:1;
    transition:background .25s cubic-bezier(.4,0,.2,1), color .25s ease, box-shadow .25s ease;
  }
  .lang-toggle-opt:hover{ color:var(--ink); }
  .lang-toggle-opt.is-active{ background:var(--accent); color:var(--accent-on); box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .lang-toggle-opt.is-active:hover{ color:var(--accent-on); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Manrope',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; transition:background .2s ease, color .2s ease;
  }
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; height:64px;
    background:var(--header-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .back{ color:var(--ink-soft); font-size:14px; text-decoration:none; font-family:var(--mono); }
  .back:hover{ color:var(--ink); }
  .doc-title{ color:var(--ink); font-weight:700; font-family:var(--serif); font-size:17px; }
  .theme-toggle{
    --w: 50px; --h: 27px;
    position:relative; flex:0 0 auto; margin-left:12px;
    width:var(--w); height:var(--h); padding:0;
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
  }
  .theme-toggle-thumb{
    position:absolute; top:2px; left:2px;
    width:calc(var(--h) - 6px); height:calc(var(--h) - 6px);
    border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center; color:var(--beige);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .theme-toggle-thumb svg{ width:13px; height:13px; }
  .theme-toggle .icon-moon{ display:none; }
  html[data-theme="dark"] .theme-toggle-thumb{ transform:translateX(calc(var(--w) - var(--h))); color:var(--accent); }
  html[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
  html[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

  .lib-layout{ display:flex; min-height:calc(100vh - 64px); align-items:stretch; }

  .lib-sidebar{
    flex:0 0 320px; max-width:320px; border-right:1px solid var(--line);
    padding:24px 0; overflow-y:auto; max-height:calc(100vh - 64px); position:sticky; top:64px;
  }
  .lib-sidebar h2{
    font-family:var(--serif); font-weight:400; font-size:19px; margin:0 22px 14px;
  }
  .lib-section-switch{ display:flex; gap:6px; padding:0 22px 16px; }
  .lib-section-btn{
    flex:1 1 auto; background:transparent; border:1px solid var(--line); border-radius:999px;
    padding:8px 12px; font-size:12.5px; font-family:var(--mono); color:var(--ink-soft);
    cursor:pointer; transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .lib-section-btn:hover{ border-color:var(--accent); color:var(--ink); }
  .lib-section-btn.is-active{ background:var(--accent); border-color:var(--accent); color:var(--accent-on); font-weight:600; }
  .lib-layout-empty{ flex-direction:column; }
  .lib-layout-empty .lib-section-switch{ max-width:420px; margin:24px auto 0; padding:0 16px; }
  .lib-topic-list{ display:flex; flex-direction:column; }
  .lib-topic-btn{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    border-left:3px solid transparent; padding:12px 22px; font-size:13.5px; line-height:1.4;
    color:var(--ink-soft); cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .lib-topic-btn:hover{ background:color-mix(in srgb, var(--ink) 4%, transparent); color:var(--ink); }
  .lib-topic-btn.is-active{ border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); color:var(--ink); font-weight:600; }

  .lib-preview{ flex:1 1 auto; padding:32px 28px 60px; display:flex; flex-direction:column; align-items:center; }
  .lib-preview-title{ font-family:var(--serif); font-weight:400; font-size:22px; max-width:760px; width:100%; margin:0 0 18px; }
  .page-wrap{
    /* фон-разделитель между сканами страниц — сами сканы всегда белые, не подстраиваем под тему */
    max-width:760px; width:100%; border:1px solid var(--line);
    border-radius:14px; box-shadow:0 12px 32px -12px rgba(29,29,31,.2); overflow:hidden;
    display:flex; flex-direction:column; gap:1px; background-color:var(--line);
  }
  .page-wrap img{
    width:100%; display:block; pointer-events:none; background:#FFFFFF;
    -webkit-user-drag:none; -webkit-touch-callout:none;
  }
  .hint{ margin-top:16px; font-size:12px; color:var(--ink-soft); text-align:center; max-width:500px; }

  /* Переход между темами (в т.ч. в соседний раздел): под конспектом, на мобильных — закреплён снизу */
  .lib-pager{
    max-width:760px; width:100%; margin-top:20px;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
  }
  .lib-pager-btn{
    display:flex; flex-direction:column; gap:2px; min-width:0;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; cursor:pointer; color:var(--ink); font-family:inherit; text-align:left;
    transition:border-color .2s ease, background .2s ease;
  }
  .lib-pager-btn:hover{ border-color:var(--accent); }
  .lib-pager-btn.next{ text-align:right; align-items:flex-end; }
  .lib-pager-btn[disabled]{ visibility:hidden; }
  .lib-pager-dir{ font-size:12px; color:var(--accent); font-weight:700; }
  .lib-pager-name{
    font-size:13px; line-height:1.3; color:var(--ink-soft); max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .lib-pager-pos{ font-size:12.5px; color:var(--ink-soft); font-family:var(--mono); white-space:nowrap; }
  .lib-topic-picker{ display:none; }

  /* Мобильная версия конспекта (текст свёрстан под телефон): куски идут встык, как одна лента */
  .page-wrap.is-flow{ gap:0; background:#FFFFFF; }
  /* Скан A4 на телефоне: нажатие открывает страницу крупно */
  .page-wrap.is-zoomable img{ pointer-events:auto; cursor:zoom-in; }
  .zoom-view{
    position:fixed; inset:0; z-index:100; background:#1b1b1d;
    display:flex; flex-direction:column;
  }
  .zoom-bar{
    display:flex; align-items:center; gap:8px; padding:10px 12px calc(10px);
    background:#111; color:#fff; font-size:13px; font-family:var(--mono);
  }
  .zoom-bar span{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .zoom-bar button{
    flex:0 0 auto; min-width:40px; height:36px; border-radius:10px; border:1px solid rgba(255,255,255,.25);
    background:transparent; color:#fff; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .zoom-scroll{ flex:1 1 auto; overflow:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y pinch-zoom; }
  .zoom-scroll img{ display:block; max-width:none; background:#fff; pointer-events:none; -webkit-user-drag:none; -webkit-touch-callout:none; }
  .missing{ padding:120px 20px; text-align:center; color:var(--ink-soft); }
  .missing a{ color:var(--accent); }

  @media (max-width:860px){
    header{ height:56px; padding:0 12px; gap:10px; }
    .back{ flex:0 0 auto; font-size:0; width:36px; height:36px; display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); border-radius:50%; color:var(--ink); }
    .back::before{ content:'←'; font-size:18px; line-height:1; }
    .doc-title{ flex:1 1 auto; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
    .lang-toggle{ margin-left:0; }
    .lang-toggle-opt{ padding:6px 9px; }
    .theme-toggle{ margin-left:8px; }

    .lib-layout{ flex-direction:column; min-height:calc(100vh - 56px); }
    .lib-sidebar{
      position:static; max-height:none; flex:0 0 auto; max-width:none;
      border-right:none; border-bottom:1px solid var(--line);
      display:flex; flex-direction:column; padding:12px 12px 12px;
    }
    .lib-section-switch{ padding:0 0 10px; gap:0; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; margin-bottom:10px; }
    .lib-section-btn{ border:none; padding:9px 8px; font-size:12.5px; line-height:1.25; }
    .lib-sidebar h2{ display:none; }
    /* Тема выбирается из раскрывающегося списка, а не из горизонтальной ленты с прокруткой */
    .lib-topic-picker{
      display:flex; align-items:center; gap:10px; width:100%;
      background:var(--surface); border:1px solid var(--line); border-radius:14px;
      padding:11px 14px; font-family:inherit; color:var(--ink); cursor:pointer; text-align:left;
    }
    .lib-topic-picker-text{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
    .lib-topic-picker-pos{ font-size:11.5px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .lib-topic-picker-name{ font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lib-topic-picker-arrow{ flex:0 0 auto; transition:transform .2s ease; color:var(--ink-soft); }
    .lib-sidebar.is-open .lib-topic-picker-arrow{ transform:rotate(180deg); }
    .lib-topic-list{
      display:none; flex-direction:column; margin-top:8px;
      background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;
    }
    .lib-sidebar.is-open .lib-topic-list{ display:flex; }
    .lib-topic-btn{ border-left:3px solid transparent; padding:12px 14px; border-top:1px solid var(--line); }
    .lib-topic-btn:first-child{ border-top:none; }

    .lib-preview{ padding:16px 0 96px; }
    .lib-preview-title{ display:none; } /* тема уже видна на кнопке выбора темы */
    /* Сканы — на всю ширину экрана, без рамки: так текст страницы крупнее */
    .page-wrap{ border-radius:0; border-left:none; border-right:none; box-shadow:none; }
    .hint{ padding:0 16px; }
    .lib-pager{
      position:fixed; left:0; right:0; bottom:0; z-index:40; margin:0; max-width:none;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background:var(--header-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border-top:1px solid var(--line); gap:8px;
    }
    .lib-pager-btn{ padding:9px 12px; border-radius:12px; }
    .lib-pager-name{ display:none; }
    .lib-pager-dir{ font-size:14px; }
  }

  .site-footer{ background:var(--surface); border-top:1px solid var(--line); }
  .footer-bottom{
    max-width:760px; margin:0 auto; padding:16px 16px 20px;
    display:flex; justify-content:center; gap:8px;
    font-size:12px; color:var(--ink-soft); user-select:text;
  }
  .footer-bottom a{ color:var(--ink-soft); text-decoration:none; }
  .footer-bottom a:hover{ color:var(--accent); }
</style>
</head>
<body>
<header>
  <a class="back" href="cabinet.html" data-i18n="back.cabinet">← В кабинет</a>
  <span class="doc-title" id="libDocTitle"></span>
  <div style="display:flex;align-items:center;">
    <button id="langToggle" class="lang-toggle" type="button" data-i18n-aria-label="lang.toggle.aria" aria-label="Переключить язык интерфейса" aria-pressed="false">
      <span class="lang-toggle-opt" data-lang-opt="ru">РУ</span>
      <span class="lang-toggle-opt" data-lang-opt="kk">ҚАЗ</span>
    </button>
    <button id="themeToggle" class="theme-toggle" type="button" data-i18n-aria-label="theme.toggle.aria" aria-label="Переключить тему" aria-pressed="false">
      <span class="theme-toggle-thumb">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
  </div>
</header>
<div id="root"><div class="missing" data-i18n="konspekty.loading">Загрузка…</div></div>
<footer class="site-footer">
  <div class="footer-bottom">
    <a href="cabinet.html" data-i18n="footer.cabinet">В кабинет</a> · <a href="index.html" data-i18n="footer.home">На главную</a>
  </div>
</footer>

<script src="i18n.js?v=4"></script>
<script src="script.js?v=39"></script>
<script>
  const root = document.getElementById('root');
  const libDocTitleEl = document.getElementById('libDocTitle');

  function showMissing(html) {
    root.innerHTML = `<div class="missing">${html}</div>`;
  }

  // Телефон: у части разделов есть мобильная версия (sec.mobile) — текст свёрстан под узкий
  // экран и лежит в папке <file>-m. Для остальных — сканы A4 с увеличением по нажатию.
  const phoneQuery = matchMedia('(max-width: 600px)');
  const useMobile = sec => phoneQuery.matches && !!sec.mobile;

  // Диапазон страниц темы: от её начала до (начала следующей темы − 1), для последней — до конца документа.
  function topicRange(sec, idx) {
    const m = useMobile(sec);
    const starts = m ? sec.mobile.starts : sec.topics.map(t => t.page);
    const from = starts[idx];
    const to = idx + 1 < starts.length ? starts[idx + 1] - 1 : (m ? sec.mobile.pages : sec.pages);
    const pages = [];
    for (let p = from; p <= to; p++) pages.push(p);
    return pages;
  }

  // Повернули телефон / изменили окно через границу 600px — перерисовать тему в нужной версии.
  let lastPreview = null;
  phoneQuery.addEventListener('change', () => {
    if (lastPreview) renderPreview(lastPreview.code, lastPreview.lib, lastPreview.sec, lastPreview.topicIdx);
  });

  function openZoom(src, title) {
    const view = document.createElement('div');
    view.className = 'zoom-view';
    view.innerHTML = `
      <div class="zoom-bar">
        <span>${esc(title)}</span>
        <button type="button" data-z="-">−</button>
        <button type="button" data-z="+">+</button>
        <button type="button" data-z="x" aria-label="Закрыть">✕</button>
      </div>
      <div class="zoom-scroll"><img src="${src}" alt=""></div>`;
    document.body.appendChild(view);
    document.body.style.overflow = 'hidden';
    const img = view.querySelector('img');
    let scale = 2.2; // ширина экрана × scale: текст A4 становится обычного размера
    const apply = () => { img.style.width = Math.round(window.innerWidth * scale) + 'px'; };
    apply();
    const close = () => { view.remove(); document.body.style.overflow = ''; };
    view.querySelector('.zoom-bar').addEventListener('click', e => {
      const z = e.target.dataset && e.target.dataset.z;
      if (z === 'x') history.back(); // закроется через popstate — без лишней записи в истории
      else if (z === '+') { scale = Math.min(4, scale + 0.4); apply(); }
      else if (z === '-') { scale = Math.max(1, scale - 0.4); apply(); }
    });
    history.pushState({ zoom: true }, '');
    addEventListener('popstate', close, { once: true }); // «назад» на телефоне закрывает просмотр
  }

  function sectionSwitchHTML(lib, sec) {
    if (lib.sections.length < 2) return '';
    return `
      <div class="lib-section-switch">
        ${lib.sections.map(s => `<button class="lib-section-btn ${s.key === sec.key ? 'is-active' : ''}" data-key="${esc(s.key)}">${esc(s.title)}</button>`).join('')}
      </div>
    `;
  }

  function wireSectionSwitch(code, lib) {
    document.querySelectorAll('.lib-section-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sec = lib.sections.find(s => s.key === btn.dataset.key);
        if (!sec) return;
        const url = new URL(location.href);
        url.searchParams.set('code', code);
        url.searchParams.set('section', sec.key);
        url.searchParams.delete('topic');
        history.replaceState(null, '', url);
        renderLibrary(code, lib, sec, 0);
      });
    });
  }

  function renderLibrary(code, lib, sec, topicIdx) {
    libDocTitleEl.textContent = sec.title;
    document.title = 'JetisHub — Конспекты · ' + sec.title;

    if (!sec.topics.length) {
      root.innerHTML = `
        <div class="lib-layout lib-layout-empty">
          ${sectionSwitchHTML(lib, sec)}
          <div class="missing">${I18N.t('konspekty.sectionSoon').replace('{title}', esc(sec.title))}</div>
        </div>
      `;
      wireSectionSwitch(code, lib);
      return;
    }

    root.innerHTML = `
      <div class="lib-layout">
        <nav class="lib-sidebar" id="libSidebar">
          ${sectionSwitchHTML(lib, sec)}
          <h2>${esc(sec.title)}</h2>
          <button class="lib-topic-picker" id="libTopicPicker" type="button" aria-expanded="false" aria-controls="libTopicList">
            <span class="lib-topic-picker-text">
              <span class="lib-topic-picker-pos" id="libPickerPos"></span>
              <span class="lib-topic-picker-name" id="libPickerName"></span>
            </span>
            <svg class="lib-topic-picker-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="lib-topic-list" id="libTopicList">
            ${sec.topics.map((t, i) => `<button class="lib-topic-btn ${i === topicIdx ? 'is-active' : ''}" data-idx="${i}">${esc(t.title)}</button>`).join('')}
          </div>
        </nav>
        <div class="lib-preview" id="libPreview"></div>
      </div>
    `;

    const sidebar = document.getElementById('libSidebar');
    const picker = document.getElementById('libTopicPicker');
    picker.addEventListener('click', () => {
      const open = sidebar.classList.toggle('is-open');
      picker.setAttribute('aria-expanded', String(open));
    });
    document.querySelectorAll('.lib-topic-btn').forEach(btn => {
      btn.addEventListener('click', () => selectTopic(code, lib, sec, Number(btn.dataset.idx)));
    });
    wireSectionSwitch(code, lib);
    renderPreview(code, lib, sec, topicIdx);
  }

  // Все темы всех разделов подряд — «Далее» после последней темы раздела ведёт в следующий раздел.
  function flatTopics(lib) {
    const out = [];
    lib.sections.forEach(s => s.topics.forEach((t, i) => out.push({ sec: s, idx: i, title: t.title })));
    return out;
  }

  function goTo(code, lib, target) {
    const current = new URLSearchParams(location.search).get('section');
    if (target.sec.key !== current) {
      const url = new URL(location.href);
      url.searchParams.set('code', code);
      url.searchParams.set('section', target.sec.key);
      url.searchParams.set('topic', target.idx);
      history.replaceState(null, '', url);
      renderLibrary(code, lib, target.sec, target.idx);
    } else {
      selectTopic(code, lib, target.sec, target.idx);
    }
  }

  function renderPreview(code, lib, sec, topicIdx) {
    const preview = document.getElementById('libPreview');
    const topic = sec.topics[topicIdx];
    const pages = topicRange(sec, topicIdx);
    const flat = flatTopics(lib);
    const pos = flat.findIndex(f => f.sec.key === sec.key && f.idx === topicIdx);
    const prev = flat[pos - 1], next = flat[pos + 1];
    const pagerBtn = (item, dir) => `
      <button class="lib-pager-btn ${dir}" type="button" data-dir="${dir}" ${item ? '' : 'disabled'}>
        <span class="lib-pager-dir">${dir === 'prev' ? '‹ Назад' : 'Далее ›'}</span>
        <span class="lib-pager-name">${item ? esc(item.title) : ''}</span>
      </button>`;
    const mobile = useMobile(sec);
    const zoomable = phoneQuery.matches && !mobile;
    const folder = mobile ? sec.file + '-m' : sec.file;
    preview.innerHTML = `
      <h3 class="lib-preview-title">${esc(topic.title)}</h3>
      <div class="page-wrap${mobile ? ' is-flow' : ''}${zoomable ? ' is-zoomable' : ''}">
        ${pages.map(p => `<img src="assets/konspekty/img/${folder}/page-${p}.jpg" alt="${esc(topic.title)}, страница ${p}" loading="lazy" oncontextmenu="return false" ondragstart="return false">`).join('')}
      </div>
      <p class="hint">${zoomable ? 'Нажмите на страницу, чтобы открыть её крупно. ' : ''}${I18N.t('konspekty.viewOnly')}</p>
      <nav class="lib-pager" aria-label="Переход между темами">
        ${pagerBtn(prev, 'prev')}
        <span class="lib-pager-pos">${pos + 1} / ${flat.length}</span>
        ${pagerBtn(next, 'next')}
      </nav>
    `;
    if (zoomable) {
      preview.querySelectorAll('.page-wrap img').forEach((img, i) => img.addEventListener('click', () =>
        openZoom(img.src, `${topic.title} · стр. ${i + 1} из ${pages.length}`)));
    }
    lastPreview = { code, lib, sec, topicIdx };
    preview.querySelectorAll('.lib-pager-btn').forEach(btn => btn.addEventListener('click', () => {
      const target = btn.dataset.dir === 'prev' ? prev : next;
      if (target) goTo(code, lib, target);
    }));

    document.getElementById('libPickerPos').textContent = `Тема ${topicIdx + 1} из ${sec.topics.length}`;
    document.getElementById('libPickerName').textContent = topic.title.replace(/^Тема \d+\.\s*/, '');
    preview.scrollTo({ top: 0 });
    window.scrollTo({ top: 0 });
  }

  function selectTopic(code, lib, sec, topicIdx) {
    const url = new URL(location.href);
    url.searchParams.set('code', code);
    url.searchParams.set('section', sec.key);
    url.searchParams.set('topic', topicIdx);
    history.replaceState(null, '', url);

    document.querySelectorAll('.lib-topic-btn').forEach(btn => {
      btn.classList.toggle('is-active', Number(btn.dataset.idx) === topicIdx);
    });
    const sidebar = document.getElementById('libSidebar');
    if (sidebar) sidebar.classList.remove('is-open');
    const picker = document.getElementById('libTopicPicker');
    if (picker) picker.setAttribute('aria-expanded', 'false');
    renderPreview(code, lib, sec, topicIdx);
  }

  async function init() {
    if (!getToken()) { location.href = 'cabinet.html'; return; }
    await API.fetchMe();
    const user = API.getCurrentUser();
    if (!user) { location.href = 'cabinet.html'; return; }

    const access = user.access || [];
    const params = new URLSearchParams(location.search);
    // Общие предметы (ТГО, английский) открыты любому вошедшему — не проверяем access.
    // Профильные предметы направления — только если код есть в test_access пользователя.
    let code = params.get('code');
    let lib = (code && COMMON_CONSPECTS[code])
      || (code && access.includes(code) && LIBRARY_CONSPECTS[code])
      || null;
    if (!lib) {
      code = Object.keys(COMMON_CONSPECTS)[0] || access.find(c => LIBRARY_CONSPECTS[c]);
      lib = COMMON_CONSPECTS[code] || LIBRARY_CONSPECTS[code];
    }

    if (!lib) {
      showMissing(`${I18N.t('konspekty.noAccess')} <a href="cabinet.html">${I18N.t('konspekty.backToCabinet')}</a>`);
      return;
    }

    const sectionKey = params.get('section');
    let sec = lib.sections.find(s => s.key === sectionKey);
    if (!sec) sec = lib.sections.find(s => s.topics.length > 0) || lib.sections[0];

    let topicIdx = parseInt(params.get('topic'), 10);
    if (!(topicIdx >= 0 && topicIdx < sec.topics.length)) topicIdx = 0;

    renderLibrary(code, lib, sec, topicIdx);
  }

  init();

  document.addEventListener('jetishub-lang-change', () => init());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['s', 'p', 'u', 'c'].includes(e.key.toLowerCase())) e.preventDefault();
  });
</script>
</body>
