<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>JetisHub — Конспект</title>
<meta name="description" content="Конспект по теме для подготовки к комплексному тестированию в магистратуру.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://marshrut-9c5z.onrender.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="icon" href="assets/brand/logo-mark.png" type="image/png">
<script>
// theme.js инлайн (раньше отдельный блокирующий запрос, ~460мс по PageSpeed) —
// источник в theme.js в корне репо, править синхронно в обоих местах.
(function () {
  var STORAGE_KEY = 'jetishub-theme';
  var root = document.documentElement;
  function getStored() { try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; } }
  function systemPrefersDark() { return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }
  function apply(theme) { root.setAttribute('data-theme', theme); }
  apply(getStored() || (systemPrefersDark() ? 'dark' : 'light'));
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    function sync() { btn.setAttribute('aria-pressed', String(root.getAttribute('data-theme') === 'dark')); }
    sync();
    btn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      apply(next);
      try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
      sync();
    });
  });
})();
</script>
<style>
  :root{
    --bg:#FBFBFA; --surface:#FFFFFF; --ink:#1D1D1F; --ink-soft:#6E6E73;
    --line:rgba(29,29,31,.12); --accent:#0A6CC9; --accent-on:#FFFFFF; --beige:#B08D46;
    --serif:'Space Grotesk','Manrope', system-ui, sans-serif; --mono:'Manrope', system-ui, sans-serif;
    --header-bg: rgba(251,251,250,.86);
  }
  html[data-theme="dark"]{
    --bg:#0A0A0B; --surface:#17171A; --ink:#F5F5F7; --ink-soft:rgba(245,245,247,.62);
    --line:rgba(255,255,255,.12); --accent:#4DA3FF; --accent-on:#08131F; --beige:#D9B676;
    --header-bg: rgba(10,10,11,.86);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Manrope',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; transition:background .2s ease, color .2s ease;
  }
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; height:64px;
    background:var(--header-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .back{ color:var(--ink-soft); font-size:14px; text-decoration:none; font-family:var(--mono); }
  .back:hover{ color:var(--ink); }
  .doc-title{ color:var(--ink); font-weight:700; font-family:var(--serif); font-size:17px; }
  .theme-toggle{
    --w: 50px; --h: 27px;
    position:relative; flex:0 0 auto; margin-left:12px;
    width:var(--w); height:var(--h); padding:0;
    background:var(--bg); border:1px solid var(--line); border-radius:999px;
  }
  .theme-toggle-thumb{
    position:absolute; top:2px; left:2px;
    width:calc(var(--h) - 6px); height:calc(var(--h) - 6px);
    border-radius:50%; background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.2);
    display:flex; align-items:center; justify-content:center; color:var(--beige);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  .theme-toggle-thumb svg{ width:13px; height:13px; }
  .theme-toggle .icon-moon{ display:none; }
  html[data-theme="dark"] .theme-toggle-thumb{ transform:translateX(calc(var(--w) - var(--h))); color:var(--accent); }
  html[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
  html[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

  main{ padding:32px 16px 40px; display:flex; flex-direction:column; align-items:center; min-height:calc(100vh - 64px); }
  .site-footer{ background:var(--surface); border-top:1px solid var(--line); }
  .footer-bottom{
    max-width:760px; margin:0 auto; padding:16px 16px 20px;
    display:flex; justify-content:center; gap:8px;
    font-size:12px; color:var(--ink-soft); user-select:text;
  }
  .footer-bottom a{ color:var(--ink-soft); text-decoration:none; }
  .footer-bottom a:hover{ color:var(--accent); }
  .page-wrap{
    /* всегда белый фон — это скан страницы конспекта, не подстраиваем под тему */
    max-width:760px; width:100%; background:#FFFFFF; border:1px solid var(--line);
    border-radius:14px; box-shadow:0 12px 32px -12px rgba(29,29,31,.2); overflow:hidden;
  }
  .page-wrap img{
    width:100%; display:block; pointer-events:none;
    -webkit-user-drag:none; -webkit-touch-callout:none;
  }
  .nav{
    display:flex; align-items:center; justify-content:center; gap:18px;
    margin-top:22px; font-family:var(--mono); font-size:13px; color:var(--ink-soft);
  }
  .nav button{
    font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:8px; padding:9px 16px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  .nav button:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .nav button:disabled{ opacity:.35; cursor:default; }
  .hint{ margin-top:14px; font-size:12px; color:var(--ink-soft); text-align:center; max-width:500px; }
  .missing{ padding:120px 20px; text-align:center; color:var(--ink-soft); }
</style>
</head>
<body>
<header>
  <a class="back" href="javascript:history.length>1?history.back():location.assign('cabinet.html')">← Назад</a>
  <span class="doc-title" id="docTitle"></span>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Переключить тему" aria-pressed="false">
    <span class="theme-toggle-thumb">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </span>
  </button>
</header>
<main id="main"></main>
<footer class="site-footer">
  <div class="footer-bottom">
    <a href="cabinet.html">В кабинет</a> · <a href="index.html">На главную</a>
  </div>
</footer>
<script>
  const DOCS = {
    pedagogika:   { title: 'Педагогика', pages: 5 },
    psikhologiya: { title: 'Психология', pages: 4 },
    'pedagogika-course': { title: 'Педагогика — конспекты по темам', pages: 29 },
    'psihologiya-course': { title: 'Психология — конспекты по темам', pages: 18 },
  };

  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const doc = DOCS[file];
  let page = Math.max(1, parseInt(params.get('page'), 10) || 1);

  const main = document.getElementById('main');
  const docTitleEl = document.getElementById('docTitle');

  if (!doc) {
    main.innerHTML = '<div class="missing">Конспект не найден.</div>';
  } else {
    if (page > doc.pages) page = doc.pages;
    docTitleEl.textContent = doc.title;
    render();
  }

  function render() {
    const url = new URL(location.href);
    url.searchParams.set('file', file);
    url.searchParams.set('page', page);
    history.replaceState(null, '', url);

    main.innerHTML = `
      <div class="page-wrap">
        <img src="assets/konspekty/img/${file}/page-${page}.jpg" alt="${doc.title}, страница ${page}"
             oncontextmenu="return false" ondragstart="return false">
      </div>
      <div class="nav">
        <button id="prevBtn" ${page <= 1 ? 'disabled' : ''}>← Пред.</button>
        <span>Страница ${page} из ${doc.pages}</span>
        <button id="nextBtn" ${page >= doc.pages ? 'disabled' : ''}>След. →</button>
      </div>
      <p class="hint">Материал доступен только для просмотра. Копирование и сохранение файла отключены.</p>
    `;
    document.getElementById('prevBtn').addEventListener('click', () => { if (page > 1) { page--; render(); } });
    document.getElementById('nextBtn').addEventListener('click', () => { if (page < doc.pages) { page++; render(); } });
  }

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['s','p','u','c'].includes(e.key.toLowerCase())) e.preventDefault();
  });
</script>
</body>
</html>
