<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Караганда — прототип</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --bg:#0f1318; --panel:rgba(18,23,30,.86); --line:rgba(255,255,255,.10);
    --text:#e8edf3; --mute:#93a0ae; --accent:#f2b84b; --ok:#5fd18a; --warn:#f2b84b; --bad:#ef7a6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0}
  .glass{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}
  #top{position:absolute;left:16px;top:16px;padding:12px 14px;max-width:330px}
  #top h1{margin:0 0 2px;font-size:16px;letter-spacing:.2px}
  #top p{margin:0;color:var(--mute);font-size:12px}
  .badge-test{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:999px;background:rgba(242,184,75,.15);color:var(--accent);font-size:11px;border:1px solid rgba(242,184,75,.35)}
  #tools{position:absolute;left:16px;top:112px;padding:10px;display:flex;flex-direction:column;gap:10px;width:260px}
  .row{display:flex;flex-direction:column;gap:4px}
  .lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;color:var(--mute);padding:7px 6px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .seg button.on{background:var(--accent);color:#1b1500;font-weight:600}
  button.act{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:8px 10px;border-radius:10px;cursor:pointer;font:inherit}
  button.act.on{background:rgba(95,209,138,.18);border-color:rgba(95,209,138,.5)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  #soilOnly{display:none}
  #legend{display:flex;flex-direction:column;gap:3px}
  #legend div{display:flex;align-items:center;gap:8px;font-size:12px}
  #legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.2)}
  #info{position:absolute;right:16px;top:16px;width:340px;max-height:calc(100% - 32px);overflow:auto;padding:14px}
  #info h2{margin:0 0 4px;font-size:15px}
  #info .hint{color:var(--mute);font-size:13px}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv b{font-weight:600}
  .pill{padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .p-ok{background:rgba(95,209,138,.16);color:var(--ok)} .p-warn{background:rgba(242,184,75,.16);color:var(--warn)} .p-bad{background:rgba(239,122,106,.16);color:var(--bad)}
  .col{display:flex;gap:12px;margin-top:10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  td{padding:5px 4px;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;color:var(--mute)}
  .locked{filter:blur(5px);user-select:none;pointer-events:none;transition:filter .3s}
  .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .cta{width:100%;margin-top:10px;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#1b1500}
  .cta.sec{background:rgba(255,255,255,.08);color:var(--text);font-weight:500}
  .note{margin-top:10px;color:var(--mute);font-size:11.5px}
  #section{position:absolute;left:16px;right:372px;bottom:16px;padding:10px 14px;display:none}
  #section h3{margin:0 0 6px;font-size:13px}
  #section svg{width:100%;height:auto;max-height:220px}
  #toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);padding:10px 16px;display:none;z-index:5}
  .maplibregl-ctrl-bottom-right{margin-bottom:4px}
  @media (max-width:820px){
    #top{max-width:calc(100% - 32px)} #tools{top:auto;bottom:16px;width:calc(100% - 32px);left:16px;max-height:34vh;overflow:auto;flex-direction:row;flex-wrap:wrap}
    #tools .row{flex:1 1 140px}
    #info{top:auto;right:16px;left:16px;bottom:calc(34vh + 32px);width:auto;max-height:34vh}
    #section{right:16px;left:16px;bottom:auto;top:96px}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="glass">
  <h1>Караганда 3D · грунт и участки</h1>
  <p>Прототип сервиса для застройщиков</p>
  <span class="badge-test">Тестовые данные скважин — случайные, не реальные</span>
</div>

<div id="tools" class="glass">
  <div class="row"><span class="lbl">Вид</span>
    <div class="seg" id="segMode"><button data-v="surface" class="on">Поверхность</button><button data-v="soil">Грунт 3D</button></div>
  </div>
  <div class="row"><span class="lbl">Подложка</span>
    <div class="seg" id="segBase"><button data-v="dark" class="on">Тёмная</button><button data-v="sat">Спутник</button></div>
  </div>
  <div class="row"><button class="act" id="btnSec">Построить разрез (2 клика)</button></div>
  <div class="row" id="soilOnly">
    <span class="lbl">Вырез блока с юга</span>
    <input type="range" id="cut" min="0" max="31" value="14">
    <div id="legend"></div>
  </div>
</div>

<div id="info" class="glass">
  <h2>Выберите участок</h2>
  <div class="hint">Кликните по карте — покажем грунт в этой точке. Данные по скважинам интерполируются по методу IDW.</div>
</div>

<div id="section" class="glass"></div>
<div id="toast" class="glass"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ---------- геометрия ---------- */
const C = {lat:49.806, lng:73.085};
const KX = 111320*Math.cos(C.lat*Math.PI/180), KY = 110574;
const toLL = (x,y)=>[C.lng + x/KX, C.lat + y/KY];
const toXY = (lng,lat)=>[(lng-C.lng)*KX, (lat-C.lat)*KY];

/* ---------- слои грунта ---------- */
const LAYERS = [
  {name:'Почвенно-растительный слой', color:'#6b4f2a'},
  {name:'Суглинок',                   color:'#b98a4e'},
  {name:'Глина',                      color:'#c9674a'},
  {name:'Песок с гравием',            color:'#e3c878'},
  {name:'Скальный грунт (выветрелый)',color:'#7f8a96'}
];
const DEPTH = 12;   // м, глубина модели
const KV = 3;       // вертикальный масштаб блока

/* ---------- тестовые скважины (случайные!) ---------- */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = rng(20261124);
function model(x,y){
  const n=()=> (rnd()-.5)*.3;
  const t=[
    Math.max(.3,.5+.25*Math.sin(x/250+1)*Math.cos(y/300)+n()),
    Math.max(.5,2.4+1.1*Math.sin(y/200)+.7*Math.cos(x/350)+n()),
    Math.max(.5,3.0+1.4*Math.cos(x/280+y/320)+n()),
    Math.max(.5,2.0+.9*Math.sin((x+y)/260)+n())
  ];
  const cap=[9.0,9.8,10.4,11.0]; const b=[]; let acc=0;
  for(let i=0;i<4;i++){acc+=t[i]; let v=Math.min(acc,cap[i]); if(i>0) v=Math.max(v,b[i-1]+.3); b.push(v);}
  const gw = Math.min(b[2], Math.max(1.2, 4.2+1.6*Math.sin(x/420)+.5*Math.cos(y/300)+n()));
  return {b,gw};
}
const BH=[];
while(BH.length<30){
  const x=(rnd()-.5)*920, y=(rnd()-.5)*920;
  if(BH.every(p=>Math.hypot(p.x-x,p.y-y)>110)){
    const m=model(x,y); const [lng,lat]=toLL(x,y);
    BH.push({id:'СКВ-'+String(BH.length+1).padStart(2,'0'),x,y,lng,lat,b:m.b,gw:m.gw});
  }
}
/* IDW по ближайшим 6 скважинам */
function interp(x,y){
  const arr=BH.map(p=>({p,d:Math.hypot(p.x-x,p.y-y)})).sort((a,b)=>a.d-b.d);
  const nn=arr.slice(0,6); let ws=0; const b=[0,0,0,0]; let gw=0;
  for(const {p,d} of nn){const w=1/(d*d+25); ws+=w; for(let i=0;i<4;i++) b[i]+=p.b[i]*w; gw+=p.gw*w;}
  return {b:b.map(v=>v/ws), gw:gw/ws, dmin:arr[0].d, near:arr[0].p.id};
}

/* ---------- карта ---------- */
const style = {
  version:8,
  sources:{
    dark:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap'},
    sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:19,attribution:'Esri, Maxar, Earthstar Geographics'},
    dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],encoding:'terrarium',tileSize:256,maxzoom:15,attribution:'Mapzen / AWS Terrain Tiles'},
    ofm:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'OpenFreeMap © OpenMapTiles, данные OSM'}
  },
  layers:[
    {id:'bg',type:'background',paint:{'background-color':'#0f1318'}},
    {id:'dark',type:'raster',source:'dark',paint:{'raster-brightness-max':.32,'raster-brightness-min':0,'raster-saturation':-.7,'raster-contrast':.25}},
    {id:'sat',type:'raster',source:'sat',layout:{visibility:'none'}},
    {id:'hill',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':.55,'hillshade-shadow-color':'#000000','hillshade-highlight-color':'#ffffff','hillshade-accent-color':'#333a44'}},
    {id:'bld',type:'fill-extrusion',source:'ofm','source-layer':'building',minzoom:13,paint:{
      'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],6],0,'#4a5568',20,'#6f8fb5',60,'#9fd0e6'],
      'fill-extrusion-height':['coalesce',['get','render_height'],6],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
      'fill-extrusion-opacity':.92}}
  ],
  terrain:{source:'dem',exaggeration:2}
};
const map = new maplibregl.Map({container:'map',style,center:[C.lng,C.lat],zoom:14.6,pitch:60,bearing:-20,maxPitch:80,hash:false});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');

/* ---------- данные для слоёв ---------- */
function circle(lng,lat,r,n=16){
  const pts=[]; for(let i=0;i<=n;i++){const a=i/n*2*Math.PI; pts.push([lng+Math.cos(a)*r/KX, lat+Math.sin(a)*r/KY]);}
  return [pts];
}
function buildBlock(){
  const N=32, S=28, feats=[];
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const cx=(i-(N-1)/2)*S, cy=(j-(N-1)/2)*S, v=interp(cx,cy);
    const poly=[[toLL(cx-S/2,cy-S/2),toLL(cx+S/2,cy-S/2),toLL(cx+S/2,cy+S/2),toLL(cx-S/2,cy+S/2),toLL(cx-S/2,cy-S/2)]];
    const bounds=[0,...v.b,DEPTH];
    for(let l=0;l<5;l++){
      feats.push({type:'Feature',properties:{row:j,color:LAYERS[l].color,base:(DEPTH-bounds[l+1])*KV,height:(bounds[l+1]-bounds[l])*KV},geometry:{type:'Polygon',coordinates:poly}});
    }
  }
  return {type:'FeatureCollection',features:feats};
}
map.on('load',()=>{
  map.addSource('block',{type:'geojson',data:buildBlock()});
  map.addLayer({id:'block',type:'fill-extrusion',source:'block',layout:{visibility:'none'},paint:{
    'fill-extrusion-color':['get','color'],'fill-extrusion-base':['get','base'],'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':true}});
  map.addSource('bh',{type:'geojson',data:{type:'FeatureCollection',features:BH.map(p=>({type:'Feature',properties:{id:p.id},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))}});
  map.addLayer({id:'bh-dot',type:'circle',source:'bh',paint:{'circle-radius':5,'circle-color':'#f2b84b','circle-stroke-color':'#1b1500','circle-stroke-width':1.5}});
  map.addSource('bhpoles',{type:'geojson',data:{type:'FeatureCollection',features:BH.map(p=>({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:circle(p.lng,p.lat,3)}}))}});
  map.addLayer({id:'bh-pole',type:'fill-extrusion',source:'bhpoles',layout:{visibility:'none'},paint:{'fill-extrusion-color':'#ffffff','fill-extrusion-height':DEPTH*KV+14,'fill-extrusion-base':0}});
  map.addSource('line',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'line',type:'line',source:'line',paint:{'line-color':'#5fd18a','line-width':3,'line-dasharray':[2,1]}});
  // легенда
  document.getElementById('legend').innerHTML = LAYERS.map(l=>`<div><i style="background:${l.color}"></i>${l.name}</div>`).join('');
});

/* ---------- режимы ---------- */
let mode='surface';
function setMode(m){
  mode=m;
  document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  const soil=m==='soil';
  const vis=(id,v)=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',v?'visible':'none');
  vis('block',soil); vis('bh-pole',soil); vis('bh-dot',!soil); vis('bld',!soil); vis('hill',!soil);
  map.setTerrain(soil?null:{source:'dem',exaggeration:2});
  document.getElementById('soilOnly').style.display=soil?'flex':'none';
  if(soil){const n=+document.getElementById('cut').value; map.setFilter('block',n?['>=',['get','row'],n]:null);}
  const pad = window.innerWidth>820 ? {left:280,right:360,top:0,bottom:0} : {left:0,right:0,top:0,bottom:0};
  setTimeout(()=>map.easeTo(soil?{pitch:50,bearing:-28,zoom:15.3,center:[C.lng,C.lat],padding:pad,duration:1400}:{pitch:60,bearing:-20,zoom:14.6,padding:{left:0,right:0,top:0,bottom:0},duration:1400}),250);
}
function setBase(b){
  document.querySelectorAll('#segBase button').forEach(x=>x.classList.toggle('on',x.dataset.v===b));
  map.setLayoutProperty('dark','visibility',b==='dark'?'visible':'none');
  map.setLayoutProperty('sat','visibility',b==='sat'?'visible':'none');
}
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>setMode(b.dataset.v));
document.querySelectorAll('#segBase button').forEach(b=>b.onclick=()=>setBase(b.dataset.v));
document.getElementById('cut').oninput=e=>{
  const n=+e.target.value; map.setFilter('block',n?['>=',['get','row'],n]:null);
};

/* ---------- клик: колонка грунта ---------- */
let marker=null, secMode=false, secPts=[], paid=false;
const f1=v=>v.toFixed(1).replace('.',',');
function columnSVG(v,w=70,h=190){
  const bounds=[0,...v.b,DEPTH]; const sy=d=>6+(h-12)*d/DEPTH;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  for(let l=0;l<5;l++) s+=`<rect x="22" y="${sy(bounds[l])}" width="${w-26}" height="${sy(bounds[l+1])-sy(bounds[l])}" fill="${LAYERS[l].color}"/>`;
  for(const d of [0,3,6,9,12]) s+=`<text x="18" y="${sy(d)+3}" fill="#93a0ae" font-size="9" text-anchor="end">${d}</text>`;
  s+=`<line x1="22" x2="${w-4}" y1="${sy(v.gw)}" y2="${sy(v.gw)}" stroke="#5ab4ff" stroke-width="2" stroke-dasharray="4 2"/></svg>`;
  return s;
}
function showPoint(lng,lat){
  const [x,y]=toXY(lng,lat); const v=interp(x,y); paid=false;
  const inside=Math.abs(x)<520&&Math.abs(y)<520;
  const conf = v.dmin<120?['Высокая','p-ok']:v.dmin<300?['Средняя','p-warn']:['Низкая','p-bad'];
  const bounds=[0,...v.b,DEPTH];
  const rows=LAYERS.map((l,i)=>`<tr><td><span class="sw" style="background:${l.color}"></span>${l.name}</td><td>${f1(bounds[i])}–${f1(bounds[i+1])} м</td></tr>`).join('');
  document.getElementById('info').innerHTML=`
    <h2>Участок</h2>
    <div class="hint">${lat.toFixed(5)}° с.ш., ${lng.toFixed(5)}° в.д.</div>
    <div class="kv"><span>Достоверность модели</span><span class="pill ${conf[1]}">${conf[0]}</span></div>
    <div class="kv"><span>Ближайшая скважина</span><b>${v.near}, ${Math.round(v.dmin)} м</b></div>
    <div class="kv"><span>Уровень грунтовых вод</span><b>${f1(v.gw)} м</b></div>
    <div class="col">${columnSVG(v)}
      <div style="flex:1"><div class="lbl" style="margin-bottom:4px">Слои по глубине</div><table id="lay" class="locked">${rows}</table></div>
    </div>
    <button class="cta" id="buy">Открыть отчёт — 15 000 ₸ (демо)</button>
    <button class="cta sec" id="order">Заказать изыскания на участке</button>
    <div class="note">${inside?'':'Точка вне пилотной зоны — модель экстраполирована. '}Модель ориентировочная и не заменяет инженерно-геологические изыскания.</div>`;
  document.getElementById('buy').onclick=()=>{paid=true;document.getElementById('lay').classList.remove('locked');document.getElementById('buy').textContent='Отчёт открыт · PDF (демо)';toast('Оплата отключена в прототипе — отчёт открыт для показа');};
  document.getElementById('order').onclick=()=>toast('Здесь будет форма заявки на изыскания');
  if(marker) marker.remove();
  marker=new maplibregl.Marker({color:'#f2b84b'}).setLngLat([lng,lat]).addTo(map);
}
let tt; function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',3200);}

/* ---------- разрез ---------- */
document.getElementById('btnSec').onclick=()=>{
  secMode=!secMode; secPts=[]; map.getSource('line')&&map.getSource('line').setData({type:'FeatureCollection',features:[]});
  const b=document.getElementById('btnSec'); b.classList.toggle('on',secMode);
  b.textContent=secMode?'Кликните 1-ю точку разреза…':'Построить разрез (2 клика)';
  document.getElementById('section').style.display='none';
  map.getCanvas().style.cursor=secMode?'crosshair':'';
};
function drawSection(a,b){
  const [ax,ay]=toXY(...a),[bx,by]=toXY(...b); const L=Math.hypot(bx-ax,by-ay), n=60;
  const S=[]; for(let k=0;k<=n;k++){const t=k/n; S.push(interp(ax+(bx-ax)*t, ay+(by-ay)*t));}
  const W=700,H=230,pl=34,pr=10,pt=8,pb=22; const sx=k=>pl+(W-pl-pr)*k/n, sy=d=>pt+(H-pt-pb)*d/DEPTH;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let l=0;l<5;l++){
    const top=S.map((s,k)=>`${sx(k)},${sy(l===0?0:s.b[l-1])}`);
    const bot=S.map((s,k)=>`${sx(k)},${sy(l===4?DEPTH:s.b[l])}`).reverse();
    svg+=`<polygon points="${top.concat(bot).join(' ')}" fill="${LAYERS[l].color}"/>`;
  }
  svg+=`<polyline points="${S.map((s,k)=>`${sx(k)},${sy(s.gw)}`).join(' ')}" fill="none" stroke="#5ab4ff" stroke-width="2" stroke-dasharray="6 3"/>`;
  for(const d of [0,3,6,9,12]) svg+=`<text x="${pl-5}" y="${sy(d)+3}" fill="#93a0ae" font-size="10" text-anchor="end">${d} м</text>`;
  svg+=`<text x="${pl}" y="${H-5}" fill="#93a0ae" font-size="10">A</text><text x="${W-pr}" y="${H-5}" fill="#93a0ae" font-size="10" text-anchor="end">B · ${Math.round(L)} м</text></svg>`;
  const el=document.getElementById('section');
  el.innerHTML=`<h3>Геологический разрез A–B · пунктир — уровень грунтовых вод</h3>${svg}`; el.style.display='block';
}

map.on('click',e=>{
  const {lng,lat}=e.lngLat;
  if(secMode){
    secPts.push([lng,lat]);
    const feats=secPts.map(p=>({type:'Feature',properties:{},geometry:{type:'Point',coordinates:p}}));
    if(secPts.length===2){
      map.getSource('line').setData({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:secPts}});
      drawSection(secPts[0],secPts[1]); secMode=false;
      const b=document.getElementById('btnSec'); b.classList.remove('on'); b.textContent='Построить новый разрез'; map.getCanvas().style.cursor='';
    } else document.getElementById('btnSec').textContent='Кликните 2-ю точку…';
    return;
  }
  showPoint(lng,lat);
});
