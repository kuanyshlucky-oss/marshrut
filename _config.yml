# GitHub Pages публикует корень репозитория целиком. Всё, что не относится к
# фронтенду (исходники и данные сервера: банки вопросов с ключами ответов,
# закрытые картинки конспектов), в публичный сайт попадать не должно.
exclude:
  - server
  - node_modules
  - .github
  - .claude
  - .npm-tmp-prefix
  - README.md
  - arman.txt
