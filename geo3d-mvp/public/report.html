<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёт по грунту участка</title>
<style>
  body{margin:0;background:#eef1f4;color:#1b2430;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .page{max-width:820px;margin:24px auto;background:#fff;padding:36px 40px;border-radius:12px;box-shadow:0 2px 20px rgba(0,0,0,.08)}
  h1{margin:0 0 4px;font-size:22px} h2{margin:26px 0 8px;font-size:16px;border-bottom:2px solid #f2b84b;padding-bottom:4px}
  .meta{color:#5b6775;font-size:13px}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e3e7ec}
  table{border-collapse:collapse;width:100%} td{padding:6px 4px;border-bottom:1px solid #e3e7ec} td:last-child{text-align:right;color:#5b6775}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:middle}
  .p-ok{color:#1f9d55}.p-warn{color:#b7791f}.p-bad{color:#c0392b} .pill{font-weight:700}
  .warn{margin-top:26px;padding:12px 14px;background:#fff7e0;border:1px solid #f2d27a;border-radius:8px;font-size:12.5px}
  .row{display:flex;gap:24px;align-items:flex-start} .btns{margin-top:18px}
  button{background:#f2b84b;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
  svg{max-width:100%;height:auto}
  @media print{body{background:#fff}.page{box-shadow:none;margin:0;padding:0}.btns{display:none}}
</style>
</head>
<body>
<div class="page" id="page"><p>Загрузка отчёта…</p></div>
<script src="/common.js"></script>
<script>
const LC={green:'#1f9d55',yellow:'#d9961a',red:'#c0392b',gray:'#8a95a3'}, LT={green:'Можно строить',yellow:'Строить можно с условиями',red:'Есть серьёзные препятствия'};
const TL={green:'зелёный',yellow:'жёлтый',red:'красный',gray:'нет данных'};
function passportBlock(pp){
  if(!pp) return '';
  const p=pp.parcel;
  return `<h2>Паспорт участка · ${pp.obj==='multi'?'многоэтажный дом':'ИЖС (частный дом)'}</h2>
    <div style="font-size:17px;font-weight:700;color:${LC[pp.overall]};margin-bottom:6px">● ${LT[pp.overall]}</div>
    ${p?`<div class="kv"><span>Кадастровый номер</span><b>${p.cad||p.id}</b></div><div class="kv"><span>Площадь</span><b>${f1(p.area_ha)} га</b></div><div class="kv"><span>Статус</span><b>${p.status_ru}</b></div><div class="kv"><span>Назначение</span><b>${p.purposes.join(', ')||'не указано'}</b></div>`:'<div class="kv"><span>Участок в базе</span><b>не найден</b></div>'}
    <table style="margin-top:8px">${pp.blocks.map(b=>`<tr><td style="width:26px;color:${LC[b.level]};font-size:16px">●</td><td><b>${b.title}</b> <span style="color:${LC[b.level]};font-size:12px">(${TL[b.level]})</span><div style="color:#5b6775;font-size:12.5px">${b.text}</div></td></tr>`).join('')}</table>
    <h2 style="margin-top:18px">Чего не хватает для начала строительства</h2><ul style="margin:6px 0 0;padding-left:20px">${pp.missing.map(m=>`<li>${m}</li>`).join('')}</ul>`;
}
(async()=>{
  const el=document.getElementById('page'), t=new URLSearchParams(location.search).get('t');
  if(!t){el.innerHTML='<p>Нет ссылки на отчёт.</p>';return;}
  try{
    const r=await jget('/api/report/'+t), cf=CONF[r.confidence];
    el.innerHTML=`
      <h1>Отчёт по грунту участка</h1>
      <div class="meta">Сформирован: ${new Date(r.generated).toLocaleString('ru-RU')} · № ${r.orderId.slice(0,8).toUpperCase()}</div>
      <h2>Участок</h2>
      <div class="kv"><span>Координаты</span><b>${r.point.lat.toFixed(5)}° с.ш., ${r.point.lng.toFixed(5)}° в.д.</b></div>
      <div class="kv"><span>Ближайшая скважина</span><b>${r.near}, ${r.dmin} м</b></div>
      <div class="kv"><span>Достоверность модели</span><b class="pill ${cf[1]}">${cf[0]}</b></div>
      <div class="kv"><span>Уровень грунтовых вод</span><b>${f1(r.gw)} м от поверхности</b></div>
      ${passportBlock(r.passport)}
      <h2>Слои грунта</h2>
      <div class="row">${columnSVG(r.b,r.gw,80,210,'#5b6775')}<table style="flex:1">${layersTable(r.b)}</table></div>
      <h2>Геологический разрез (запад–восток, ${r.section.length} м)</h2>
      ${sectionSVG(r.section,'#5b6775')}
      <div class="warn"><b>Важно.</b> Модель построена интерполяцией по ближайшим скважинам и является ориентировочной. Она не заменяет инженерно-геологические изыскания, обязательные для проектирования. Для точных данных на вашем участке закажите изыскания.</div>
      <div class="btns"><button onclick="track('print');print()">Печать / сохранить в PDF</button></div>`;
  }catch(e){ el.innerHTML=`<h1>Отчёт недоступен</h1><p>${e.message}</p>`; }
})();
</script>
</body>
</html>
